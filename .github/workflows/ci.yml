name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + unit + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The integration tests start a real PostgreSQL through Testcontainers, which uses the
      # Docker daemon that GitHub-hosted Ubuntu runners already provide.
      - name: Build and test
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test -- --watchAll=false

      - name: Build
        # CI=false: Create React App turns every ESLint warning into a build error when CI=true.
        run: npm run build
        env:
          CI: 'false'

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config -q
        env:
          POSTGRES_PASSWORD: ci-password
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci-secret-ci-secret-1234

      - name: Build backend image
        run: docker build -t finpay-backend ./backend

      - name: Build frontend image
        run: docker build -t finpay-frontend ./frontend
