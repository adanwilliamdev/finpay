spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finpay_dev
    username: finpay_user
    password: finpay_password
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: devSecretKeyForTestingOnly12345678901234567890
  expiration: 86400000

logging:
  level:
    com.finpay: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 8080