spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finpay
    username: finpay_user
    password: finpay_password
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

finpay:
  seed:
    demo-users: true

jwt:
  # Development only. HS512 needs a key of at least 64 bytes (the previous dev key had 46
  # and would have made token generation fail with a WeakKeyException).
  secret: dev-only-secret-key-do-not-use-in-production-0123456789abcdef0123456789abcdef
  expiration: 86400000

logging:
  level:
    com.finpay: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: 8080
