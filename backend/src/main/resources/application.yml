spring:
  application:
    name: finpay-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finpay}
    username: ${DB_USER:finpay_user}
    password: ${DB_PASSWORD:finpay_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

finpay:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  seed:
    # Creates admin@finpay.com / user@finpay.com on startup. Off by default; NEVER enable in production.
    demo-users: ${SEED_DEMO_USERS:false}
  reversal:
    # How long after a transfer/withdrawal its sender may still reverse it (admins: unlimited)
    user-window-minutes: ${REVERSAL_USER_WINDOW_MINUTES:30}
  idempotency:
    # How long an Idempotency-Key is remembered. A retry after this window is processed again.
    retention-hours: ${IDEMPOTENCY_RETENTION_HOURS:24}
  rate-limit:
    # Throttles POST /auth/login and /auth/register per client IP (in memory, per instance).
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Only enable behind a proxy that APPENDS the real peer to X-Forwarded-For (e.g. the bundled
    # nginx). Otherwise the header is client-controlled and would let callers dodge the limit.
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
    login:
      max-requests: ${RATE_LIMIT_LOGIN_MAX:10}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    register:
      max-requests: ${RATE_LIMIT_REGISTER_MAX:5}
      window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:3600}

jwt:
  # No default on purpose: the application refuses to start without JWT_SECRET
  # (at least 64 characters, required by HS512). Generate one with: openssl rand -hex 32
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:7200000} # 2 hours

logging:
  level:
    com.finpay: INFO
    org.springframework.security: INFO

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
