# Used by the integration tests (profile "test"). The datasource comes from Testcontainers.
spring:
  datasource:
    hikari:
      maximum-pool-size: 20
  jpa:
    show-sql: false

finpay:
  seed:
    demo-users: false
  reversal:
    user-window-minutes: 30
  rate-limit:
    # Integration tests register many users from the same (mock) IP.
    enabled: false

jwt:
  secret: test-only-secret-key-0123456789abcdef0123456789abcdef0123456789abcdef
  expiration: 3600000

logging:
  level:
    com.finpay: WARN
    org.springframework.security: WARN
