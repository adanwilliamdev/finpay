services:
  postgres:
    image: postgres:15-alpine
    container_name: finpay-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finpay}
      POSTGRES_USER: ${POSTGRES_USER:-finpay_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (veja .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finpay-network

  backend:
    build:
      context: ./backend
    container_name: finpay-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finpay}
      DB_USER: ${POSTGRES_USER:-finpay_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (veja .env.example)}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (veja .env.example)}
      PORT: 8080
      # Demo accounts (admin@finpay.com / user@finpay.com). Remove for any real deployment.
      SEED_DEMO_USERS: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finpay-network

  frontend:
    build:
      context: ./frontend
    container_name: finpay-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - finpay-network

volumes:
  postgres_data:

networks:
  finpay-network:
    driver: bridge
